<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복지톡 - 맞춤형 복지 서비스</title>
    <!-- 구글 폰트 (Inter, Cormorant Garamond) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide 아이콘 (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
	<!-- 로그인 페이지 -->
	<section id="login-page" class="login-page active-login">
	    <div class="login-card">
	        <div class="login-logo">
	            <i data-lucide="message-circle"></i>
	        </div>
	
	        <h1 class="login-title">복지톡</h1>
	        <p class="login-subtitle">
	            맞춤형 복지 서비스 안내 및 AI 상담 플랫폼
	        </p>
	
	        <div class="login-form">
	            <input type="email" id="login-email" placeholder="이메일 입력">
	            <input type="password" id="login-password" placeholder="비밀번호 입력">
	
	            <button class="login-button" onclick="login()">
	                로그인
	            </button>
	            <button class="signup-move-button" onclick="openSignup()">
    				회원가입
				</button>
	           
	        </div>
	    </div>
	</section>
	
	<!-- 회원가입 페이지 -->
<section id="signup-page" class="login-page" style="display:none;">

    <div class="login-card">

        <div class="login-logo">
            <i data-lucide="user-plus"></i>
        </div>

        <h1 class="login-title">회원가입</h1>

        <div class="login-form">

            <input type="text" id="signup-name" placeholder="이름 입력">

            <input type="date" id="signup-birth">

            <input type="email" id="signup-email" placeholder="이메일 입력">

            <input type="password" id="signup-password" placeholder="비밀번호 입력">

            <!-- <select id="signup-location">
                <option value="">사는 지역 선택</option>
                <option value="서울">서울</option>
                <option value="경기">경기</option>
                <option value="인천">인천</option>
                <option value="부산">부산</option>
            </select>

            <input type="text" id="signup-job" placeholder="현재 직업 입력">  -->

            <button class="login-button" onclick="signup()">
                가입하기
            </button>

            <button class="signup-move-button" onclick="backToLogin()">
                로그인으로 돌아가기
            </button>

        </div>

    </div>

</section>
	
	<!-- 메인 앱 -->
    <div id="main-app" style="display:none;">
    <!-- 헤더 섹션 시작 -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo" onclick="switchSection('home')" style="cursor: pointer;">
                <i data-lucide="message-circle" class="logo-icon"></i>
                <span class="logo-text">복지톡</span>
            </div>
        </div>
    </header>
    <!-- 헤더 섹션 끝 -->

    <main class="content-area">
        <!-- 홈 섹션 시작 -->
        <section id="home" class="view-section active">
		<br>
		<br>
            <!-- 메인 카드 -->
            <div class="hero-card">
                <div class="hero-header">
                    <div class="heart-icon-wrapper">
                        <i data-lucide="heart"></i>
                    </div>
                    <div class="hero-titles">
                        <h1 class="hero-title">따뜻한 복지 상담</h1>
                        <p class="hero-subtitle">말 한마디로 시작하는 권리 찾기</p>
                    </div>
                </div>

                <div class="search-container">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="home-search-input" placeholder="궁금한 혜택을 검색해보세요..." class="hero-search-input">
                </div>

                <div class="hero-footer">
                    <p class="user-greeting" id="user-greeting">사용자님, 복지톡이 곁에 있어요!</p>
                    <button class="start-chat-btn" onclick="startChatFromHome()">
                        상담 시작 <i data-lucide="arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- 서브 카드 버튼 -->
            <div class="sub-actions-grid">
                <div class="sub-action-card dark" onclick="switchSection('calendar')">
                    <div class="sub-icon-bg">
                        <i data-lucide="calendar"></i>
                    </div>
                    <span class="sub-action-label">복지 캘린더</span>
                </div>
                <div class="sub-action-card dark" onclick="switchSection('guide')">
                    <div class="sub-icon-bg">
                        <i data-lucide="file-text"></i>
                    </div>
                    <span class="sub-action-label">준비 가이드</span>
                </div>
            </div>
        </section>
        <!-- 홈 섹션 끝 -->

        <!-- 복지목록 섹션 (추가) -->
        <section id="list" class="view-section">
            <div class="page-header">
                <h2 class="page-title">복지 목록</h2>
            </div>
            <div id="full-benefit-list" class="benefit-grid">
                <!-- 자바스크립트에서 렌더링 -->
            </div>
        </section>

        <!-- AI 상담 섹션 시작 -->
        <section id="chat" class="view-section">
            <div class="chat-container">
                <div class="chat-header">
                    <button class="back-button" onclick="switchSection('home')">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <h3>AI 복지 상담사</h3>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="message ai-message">
                        안녕하세요! AI 복지 상담사입니다. 무엇을 도와드릴까요? 
                        <br>현재 상황이나 궁금한 복지 혜택에 대해 편하게 말씀해주세요.
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" placeholder="메시지를 입력하세요..." id="chat-input">
                    <button class="send-button">
                        <i data-lucide="send"></i>
                    </button>
                </div>
            </div>
        </section>
        <!-- AI 상담 섹션 끝 -->

        <!-- 캘린더 섹션 시작 -->
        <section id="calendar" class="view-section">
            <div class="page-header">
                <h2 class="page-title">복지 캘린더</h2>
                <div class="calendar-controls">
                    <button class="icon-button" id="prev-month"><i data-lucide="chevron-left"></i></button>
                    <span class="current-month" id="display-month">2026년 4월</span>
                    <button class="icon-button" id="next-month"><i data-lucide="chevron-right"></i></button>
                </div>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- 자바스크립트에서 렌더링됨 -->
            </div>
            <div class="interest-list">
                <h3 class="subsection-title">관심 있는 혜택</h3>
                <div id="favorite-list" class="mini-benefit-list">
                    <!-- 관심 등록한 혜택이 여기에 표시됨 -->
                </div>
            </div>
        </section>
        <!-- 캘린더 섹션 끝 -->

        <!-- 가이드 섹션 시작 -->
        <section id="guide" class="view-section">
            <div class="page-header">
                <h2 class="page-title">준비 가이드</h2>
            </div>
            <div class="guide-tabs">
                <button class="guide-tab active" data-guide="document">필수 서류</button>
                <button class="guide-tab" data-guide="glossary">용어 사전</button>
            </div>
            <div id="guide-content" class="guide-content-area">
                <!-- 가이드 내용이 여기에 표시됨 -->
            </div>
        </section>
        <!-- 가이드 섹션 끝 -->

        <!-- 프로필 섹션 시작 -->
        <section id="profile" class="view-section">
            <div class="profile-header-large">
                <div class="profile-avatar-large">
                    <img src="https://picsum.photos/seed/user123/200" alt="프로필">
                </div>
                <h2 class="profile-name" id="profile-name">홍길동</h2>
                <p class="profile-email" id="profile-email">hong@example.com</p>
            </div>
            <div class="profile-form">
                <div class="form-group">
                    <label>지역</label>
                    <select id="user-location">
                        <option value="서울" selected>서울</option>
                        <option value="경기">경기</option>
                        <option value="인천">인천</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>관심 분야</label>
                    <div class="interest-chips" id="profile-interests">
                        <!-- 관심 분야 칩들이 여기에 표시됨 -->
                    </div>
                </div>
                <button class="save-button" onclick="openEditProfile()">정보 수정하기</button>
                <button class="logout-button" onclick="logout()">로그아웃</button>
            </div>
        </section>
        <!-- 정보 수정 섹션 -->
		<section id="edit-profile" class="view-section">
		
		    <div class="chat-header">
		        <button class="back-button" onclick="switchSection('profile')">
		            <i data-lucide="chevron-left"></i>
		        </button>
		        <h3>정보 수정</h3>
		    </div>
		
		    <div class="profile-form">
		
		        <div class="form-group">
		            <label>이름</label>
		            <input type="text" id="edit-name" placeholder="이름 입력">
		        </div>
		
		        <div class="form-group">
		            <label>이메일</label>
		            <input type="email" id="edit-email" placeholder="이메일 입력">
		        </div>
		
		        <div class="form-group">
		            <label>지역</label>
		            <select id="edit-location">
		                <option value="서울">서울</option>
		                <option value="경기">경기</option>
		                <option value="인천">인천</option>
		            </select>
		        </div>
		
		        <button class="save-button" onclick="saveProfile()">
		            저장하기
		        </button>
		
		    </div>
		</section>
        <!-- 프로필 섹션 끝 -->
    </main>

<!-- 하단 네비게이션 -->
<nav class="mobile-bottom-nav">
    <div class="nav-container">
        <div class="bottom-nav-item active" onclick="switchSection('home')">
            <div class="nav-item-bg"></div>
            <i data-lucide="home"></i>
            <span>홈</span>
            <div class="active-dot"></div>
        </div>
        <div class="bottom-nav-item" onclick="switchSection('chat')">
            <div class="nav-item-bg"></div>
            <i data-lucide="message-circle"></i>
            <span>상담</span>
        </div>
        <div class="bottom-nav-item" onclick="switchSection('calendar')">
            <div class="nav-item-bg"></div>
            <i data-lucide="calendar"></i>
            <span>캘린더</span>
        </div>
        <div class="bottom-nav-item" onclick="switchSection('profile')">
            <div class="nav-item-bg"></div>
            <i data-lucide="user"></i>
            <span>프로필</span>
        </div>
    </div>
</nav>

    <!-- 모달/팝업 섹션 -->
    <div id="calendar-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-date-title">5월 5일</h3>
                <button class="modal-close" onclick="closeCalendarModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-event-body">
                <!-- 이벤트 내용이 동적으로 삽입됨 -->
            </div>
        </div>
    </div>
</div>
    <!-- 외부 자바스크립트 연결 -->
    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
